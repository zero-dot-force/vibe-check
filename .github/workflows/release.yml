# Release pipeline: triggered manually via workflow_dispatch with a tag
# input. Delegates tag validation and CI checks to org-infra reusable
# workflows, then runs GoReleaser to build and publish.
name: Release — GoReleaser

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    name: Preflight — Tag Validation & CI Checks
    uses: complytime/org-infra/.github/workflows/reusable_release_preflight.yml@58194ad2d1b24803263cac6fd1b54422e3c208dd # main
    with:
      tag: ${{ inputs.tag }}
    permissions:
      # Mirrors the scopes reusable_release_preflight.yml declares at the pinned
      # SHA (contents: write for tag creation, checks: read for CI verification).
      # A called workflow cannot elevate beyond the caller's grant. When bumping
      # the pinned SHA, re-audit these grants against the callee's declared
      # scopes at the new SHA before merging.
      contents: write
      checks: read
    secrets: inherit

  release:
    name: Release — GoReleaser
    needs: preflight
    uses: complytime/org-infra/.github/workflows/reusable_release_goreleaser.yml@58194ad2d1b24803263cac6fd1b54422e3c208dd # main
    with:
      tag: ${{ needs.preflight.outputs.tag }}
    permissions:
      # Mirrors the scopes reusable_release_goreleaser.yml declares at the pinned
      # SHA (contents: write for the GitHub Release, id-token: write for
      # cosign/syft). A called workflow cannot elevate beyond the caller's grant.
      # When bumping the pinned SHA, re-audit these grants against the callee's
      # declared scopes at the new SHA before merging.
      contents: write
      id-token: write
    secrets: inherit