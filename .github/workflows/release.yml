# Release pipeline: run from main with the tag (don't push tags yourself):
#
#   gh workflow run release.yml -f tag=v0.4.0
#
# The pipeline is jflowers/ship's shared go-release.yml, the same one
# replicator, dewey and gaze use: the run must be on main, org-infra's
# preflight checks the tag (semver, new, newer than the last), that the CI
# checks below passed on HEAD and that there are unreleased commits, then
# creates the tag; GoReleaser (org-infra, through ship) builds and
# publishes the release with checksums, cosign signatures and SBOMs. No
# signing secrets or tap are passed, so the darwin archives ship unsigned
# and no cask is published, as before.
name: Release — GoReleaser

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/go-release.yml@7c6c0e199099d732e0db93c8c9d86b0064c2759c # v0.9.0
    with:
      tag: ${{ inputs.tag }}
      # The check-run names on HEAD (bare job names from ci.yml). Keep in
      # sync with .github/workflows/ci.yml if job names change.
      ci_checks: '["lint", "test"]'
    # The scopes go-release.yml's jobs need: contents: write (tag, release),
    # checks: read (CI verification), id-token: write (cosign, syft).
    permissions:
      contents: write
      checks: read
      id-token: write
