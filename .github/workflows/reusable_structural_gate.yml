# Reusable Structural Gate — Design Quality Regression
# ====================================================
# Purpose (CI-011): a reusable design-quality regression gate for Go
# repositories. Any repository consumes it via a SHA-pinned `uses:` reference
# and gets vibe-check's structural gate on its pull requests without building
# vibe-check from source.
#
# Contract (design.md D1/D2/D11): the gate job installs the released
# vibe-check binary (selected by the `version` input, checksum-verified
# against the release's checksums.txt), checks out the caller's PR head and
# base revisions itself, analyzes both with `vibe-check analyze`, fails on a
# REQUEST_CHANGES verdict from `diff --gate` (protected thresholds by
# default; the three max-*-delta inputs are tighten-only overrides), and
# appends the `diff --markdown` report to the job step summary.
#
# Trust model (design.md D6): the gate itself runs only the released,
# checksum-verified binary — trusted code. `vibe-check analyze` compiles the
# caller's target module, which is the same trust posture as running Go
# tests on a fork PR in the caller's own CI; there is deliberately no fork
# guard (callers who want one can add their own job-level `if:`). No secrets
# are required or read, so fork PRs work with zero configuration. Both
# checkout steps set persist-credentials: false (spec-review advisory):
# the job token is used only for the clone itself and is never persisted
# into .git/config, where the caller's compiled build code could otherwise
# read it.
#
# Caller permissions (design.md D7): this workflow declares only
# `contents: read` (needed for the two checkout steps; the release download
# needs no token). Callers using a top-level default-deny `permissions: {}`
# MUST grant job-level `contents: read` on the calling job, or this
# workflow's job fails at startup. Never grant more than the callee declares
# at its pinned SHA.
#
# Input handling: caller-controlled inputs are never interpolated directly
# into `run:` scripts. Each consuming step routes them through its `env:`
# block and references them as quoted shell variables (e.g. "$VERSION") —
# defense-in-depth against input injection.
#
# Consumer contract: see the "CI integration" section of the vibe-check
# README (usage snippet, input table, permissions guidance, trust model, and
# version-pinning guidance).

name: Reusable Structural Gate — Design Quality Regression

on:
  workflow_call:
    inputs:
      version:
        description: "vibe-check release tag to install (e.g. v0.2.1). The literal 'latest' resolves the newest published release; pin an explicit tag for reproducible gates."
        required: false
        default: "latest"
        type: string
      path:
        description: "Caller's Go module directory to analyze, relative to the repository root ('.' for a root module, or a subdirectory such as 'services/api' in a monorepo). The same subpath under the base checkout is analyzed for the base snapshot."
        required: false
        default: "."
        type: string
      timeout:
        description: "Per-analysis timeout (Go duration string, e.g. 5m) forwarded to vibe-check analyze for both the head and base snapshots."
        required: false
        default: "5m"
        type: string
      go-version-file:
        description: "Path to the caller's go.mod, relative to the head checkout root, whose Go version actions/setup-go installs. analyze forces GOTOOLCHAIN=local, so the installed toolchain must satisfy the caller's module."
        required: false
        default: "go.mod"
        type: string
      max-instability-delta:
        description: "Optional tighten-only instability-delta threshold forwarded to diff --gate as --max-instability-delta. Unset keeps the protected default (0.15); a looser value is rejected by the CLI with exit 2 rather than weakening the gate."
        required: false
        type: string
      max-distance-delta:
        description: "Optional tighten-only distance-delta threshold forwarded to diff --gate as --max-distance-delta. Unset keeps the protected default (0.20); a looser value is rejected by the CLI with exit 2 rather than weakening the gate."
        required: false
        type: string
      max-lcom-delta:
        description: "Optional tighten-only LCOM-delta threshold forwarded to diff --gate as --max-lcom-delta. Unset keeps the protected default (2); a looser value is rejected by the CLI with exit 2 rather than weakening the gate."
        required: false
        type: string

permissions:
  contents: read

jobs:
  structural-gate:
    name: Structural Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Step order per design.md D11: install (download + verify + extract)
      # → checkout head → checkout base → setup-go → analyze head → analyze
      # base → gate (diff --gate) → report (diff --markdown to the step
      # summary). Tasks 1.3-1.4 add the remaining steps in this order.
      #
      # Install (task 1.2, design D3/D4): the released binary is installed
      # under RUNNER_TEMP — outside the workspace, so the caller checkouts
      # cannot clobber it and cannot collide with caller-tracked filenames —
      # and the install dir is appended to GITHUB_PATH so later steps invoke
      # plain `vibe-check`.
      - name: Install vibe-check
        env:
          # Input-injection defense (header rule): the caller-controlled
          # version input reaches the script only through env, referenced
          # as a quoted shell variable — never ${{ }} interpolation in run:.
          VIBE_CHECK_VERSION: ${{ inputs.version }}
        # `shell: bash` runs with -e -o pipefail; the script repeats the
        # guard so the checksum pipeline stays fail-closed under any
        # invocation of the script.
        shell: bash
        run: |
          set -euo pipefail

          # Constant asset name per design D3: the job pins
          # runs-on: ubuntu-latest, so the platform is fixed and the
          # verification tooling (sha256sum, tar) is guaranteed present.
          asset="vibe-check_linux_amd64.tar.gz"

          # Hardcoded to vibe-check's own releases: in a called workflow
          # the github context refers to the CALLER's repository, so the
          # release source cannot be derived from github.repository.
          release_base="https://github.com/zero-dot-force/vibe-check/releases"

          # Design D4: the literal 'latest' resolves through the permanent
          # redirect endpoint (no API call, no token); any other value is a
          # release tag with its own download directory. A missing or
          # nonexistent tag makes curl -f fail the step before any
          # analysis runs — no silent fallback.
          if [ "$VIBE_CHECK_VERSION" = "latest" ]; then
            download_base="$release_base/latest/download"
          else
            download_base="$release_base/download/$VIBE_CHECK_VERSION"
          fi

          install_dir="$RUNNER_TEMP/vibe-check"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl -fsSLO "$download_base/$asset"
          curl -fsSLO "$download_base/checksums.txt"

          # Fail-closed checksum verification: `sha256sum --check
          # --ignore-missing` exits 0 even when zero files matched, so
          # filter checksums.txt to exactly the downloaded asset's line
          # and check only that line. A missing or renamed asset empties
          # the grep and fails the pipeline under pipefail.
          grep "${asset}$" checksums.txt | sha256sum --check -

          tar -xzf "$asset"

          # Smoke test: the goreleaser archive places the binary at the
          # archive root — ./vibe-check, no bin/ directory.
          ./vibe-check --version

          # Expose the binary to the analyze/gate/report steps (tasks
          # 1.3-1.4) as plain `vibe-check` on PATH.
          echo "$install_dir" >> "$GITHUB_PATH"

      # Checkout head (task 1.3, design D2): the default pull_request
      # checkout of the caller's PR — the head snapshot. persist-credentials:
      # false (spec-review advisory): actions/checkout would otherwise persist
      # the job token into this checkout's .git/config, and the analyze steps
      # (task 1.4) compile the caller's — possibly untrusted fork-PR — build
      # code over this directory, which could read it. The token is needed
      # only for the clone; nothing later in the job touches a git remote.
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Checkout base (task 1.3, design D2): the base snapshot as a sibling
      # directory, mirroring structural-gate.yml. The caller's pull_request
      # event context (github.event.pull_request.base.sha) propagates into
      # this called workflow, so the base revision resolves with no extra
      # caller input. Requires a pull_request-triggered caller — other event
      # shapes are the caller's problem (design non-goal). Same
      # persist-credentials: false hardening as the head checkout.
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Setup Go (task 1.3, design D5): analyze forces GOTOOLCHAIN=local —
      # it never downloads a toolchain named by the caller's go.mod — so a
      # satisfying toolchain must be installed first. go-version-file reads
      # the caller's declared version from the head checkout root (default
      # go.mod; monorepo callers pass their module's go.mod), exactly like
      # the self-gate. The base checkout is analyzed with the same installed
      # toolchain: if the base module would need a newer Go than the head's
      # go.mod names, the base analysis fails as a visible tool failure.
      # The with: interpolation below passes a caller-controlled value as an
      # action input, not into a run: script — the header's input-injection
      # rule (env-only routing in run:) does not apply to action inputs.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
